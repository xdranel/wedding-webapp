<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-shell">
<main class="auth-card card">
    <h1>Sign in</h1>
    <p class="status status-error" th:if="${param.error}" role="alert">Invalid username or password.</p>
    <p class="status" th:if="${param.logout}" role="status">You have signed out.</p>
    <p class="status status-error" th:if="${param.expired}" role="alert">Your session has expired.</p>
    <p class="status" th:if="${param.passwordChanged}" role="status">Password changed. Sign in again.</p>
    <form class="form-grid" method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </p>
        <p>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </p>
        <button class="button" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
