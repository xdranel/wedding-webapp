<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm check-in</title></head>
<body>
<main>
  <h1>Confirm check-in</h1>
  <p><a th:href="@{/check-in}">Back to check-in</a></p>
  <dl>
    <dt>Guest</dt><dd th:text="${preview.displayName}">Guest</dd>
    <dt>Category</dt><dd th:text="${preview.categoryName == null ? 'Uncategorized' : preview.categoryName}">Category</dd>
    <dt>Phone</dt><dd th:text="${preview.maskedWhatsappNumber}">•••• 0000</dd>
    <dt>Plus one</dt><dd th:text="${preview.plusOneAllowed ? 'Allowed' : 'Not allowed'}">Not allowed</dd>
    <dt>RSVP</dt><dd th:text="${preview.rsvpResponse == null ? 'No RSVP' : preview.rsvpResponse}">No RSVP</dd>
    <dt>Planned attendees</dt><dd th:text="${preview.plannedAttendeeCount == null ? '—' : preview.plannedAttendeeCount}">—</dd>
  </dl>
  <section th:if="${preview.currentCheckIn != null}" aria-labelledby="current-heading">
    <h2 id="current-heading">Current check-in</h2>
    <p>Checked in at <time th:text="${preview.currentCheckIn.checkedInAt}">Time</time> by <span th:text="${preview.currentCheckIn.checkedInByUsername}">Staff</span>; count <span th:text="${preview.currentCheckIn.actualAttendeeCount}">1</span>.</p>
  </section>
  <p th:if="${preview.rsvpChangeRequired}" role="alert">This guest's RSVP will be changed to attending when you confirm.</p>
  <form method="post" th:action="${qr} ? @{/check-in/confirm/qr} : @{/check-in/confirm/guest/{id}(id=${preview.guestId})}" th:object="${form}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input th:if="${qr}" type="hidden" th:field="*{payload}">
    <input th:unless="${qr}" type="hidden" th:field="*{guestVersion}">
    <fieldset>
      <legend>Actual attendees</legend>
      <input th:unless="${preview.plusOneAllowed}" type="hidden" th:field="*{actualCount}" value="1">
      <label><input th:if="${preview.plusOneAllowed}" type="radio" th:field="*{actualCount}" value="1"> 1</label>
      <label th:if="${preview.plusOneAllowed}"><input type="radio" th:field="*{actualCount}" value="2"> 2</label>
    </fieldset>
    <label th:if="${preview.rsvpChangeRequired}"><input type="checkbox" th:field="*{acceptRsvpChange}"> I accept the RSVP change</label>
    <button type="submit">Confirm check-in</button>
  </form>
</main>
</body>
</html>
