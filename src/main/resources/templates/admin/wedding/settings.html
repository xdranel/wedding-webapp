<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding settings</title>
</head>
<body>
<main>
    <h1>Wedding settings</h1>
    <form method="post" th:action="@{/admin/wedding/settings}" th:object="${form}">
        <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Settings error</p>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{version}">
        <label for="couple-title">Couple title</label>
        <input id="couple-title" th:field="*{coupleTitle}" maxlength="160"
               th:attr="aria-describedby=${#fields.hasErrors('coupleTitle')} ? 'couple-title-error' : null">
        <p id="couple-title-error" th:if="${#fields.hasErrors('coupleTitle')}" th:errors="*{coupleTitle}">Couple title
            error</p>
        <label for="opening-text-id">Opening text (Indonesian)</label>
        <textarea id="opening-text-id" th:field="*{openingTextId}" required maxlength="2000"
                  th:attr="aria-describedby=${#fields.hasErrors('openingTextId')} ? 'opening-text-id-error' : null"></textarea>
        <p id="opening-text-id-error" th:if="${#fields.hasErrors('openingTextId')}" th:errors="*{openingTextId}">Opening
            text error</p>
        <label for="opening-text-en">Opening text (English)</label>
        <textarea id="opening-text-en" th:field="*{openingTextEn}" maxlength="2000"
                  th:attr="aria-describedby=${#fields.hasErrors('openingTextEn')} ? 'opening-text-en-error' : null"></textarea>
        <p id="opening-text-en-error" th:if="${#fields.hasErrors('openingTextEn')}" th:errors="*{openingTextEn}">Opening
            text error</p>
        <label for="closing-text-id">Closing text (Indonesian)</label>
        <textarea id="closing-text-id" th:field="*{closingTextId}" required maxlength="2000"
                  th:attr="aria-describedby=${#fields.hasErrors('closingTextId')} ? 'closing-text-id-error' : null"></textarea>
        <p id="closing-text-id-error" th:if="${#fields.hasErrors('closingTextId')}" th:errors="*{closingTextId}">Closing
            text error</p>
        <label for="closing-text-en">Closing text (English)</label>
        <textarea id="closing-text-en" th:field="*{closingTextEn}" maxlength="2000"
                  th:attr="aria-describedby=${#fields.hasErrors('closingTextEn')} ? 'closing-text-en-error' : null"></textarea>
        <p id="closing-text-en-error" th:if="${#fields.hasErrors('closingTextEn')}" th:errors="*{closingTextEn}">Closing
            text error</p>
        <label for="time-zone">Time zone</label>
        <input id="time-zone" th:field="*{timeZone}" required
               th:attr="aria-describedby=${#fields.hasErrors('timeZone')} ? 'time-zone-error' : null">
        <p id="time-zone-error" th:if="${#fields.hasErrors('timeZone')}" th:errors="*{timeZone}">Time zone error</p>
        <label for="rsvp-deadline">RSVP deadline</label>
        <input id="rsvp-deadline" type="datetime-local" th:field="*{rsvpDeadline}"
               th:attr="aria-describedby=${#fields.hasErrors('rsvpDeadline')} ? 'rsvp-deadline-error' : null">
        <p id="rsvp-deadline-error" th:if="${#fields.hasErrors('rsvpDeadline')}" th:errors="*{rsvpDeadline}">RSVP
            deadline error</p>
        <label for="phone-country">Default phone country</label>
        <input id="phone-country" th:field="*{defaultPhoneCountry}" required pattern="[A-Z]{2}"
               th:attr="aria-describedby=${#fields.hasErrors('defaultPhoneCountry')} ? 'phone-country-error' : null">
        <p id="phone-country-error" th:if="${#fields.hasErrors('defaultPhoneCountry')}"
           th:errors="*{defaultPhoneCountry}">Phone country error</p>
        <label for="accent-color">Accent color</label>
        <input id="accent-color" th:field="*{accentColor}" required pattern="#[0-9A-Fa-f]{6}"
               th:attr="aria-describedby=${#fields.hasErrors('accentColor')} ? 'accent-color-error' : null">
        <p id="accent-color-error" th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}">Accent color
            error</p>
        <label for="font-preset">Font preset</label>
        <select id="font-preset" th:field="*{fontPreset}"
                th:attr="aria-describedby=${#fields.hasErrors('fontPreset')} ? 'font-preset-error' : null">
            <option th:each="preset : ${fontPresets}" th:value="${preset}" th:text="${preset}">CLASSIC</option>
        </select>
        <p id="font-preset-error" th:if="${#fields.hasErrors('fontPreset')}" th:errors="*{fontPreset}">Font preset
            error</p>
        <input id="greetings-enabled" type="checkbox" th:field="*{greetingsEnabled}">
        <label for="greetings-enabled">Enable greetings</label>
        <input id="private-organizer-note-enabled" type="checkbox" th:field="*{privateOrganizerNoteEnabled}">
        <label for="private-organizer-note-enabled">Enable private organizer notes</label>
        <input id="calendar-downloads-enabled" type="checkbox" th:field="*{calendarDownloadsEnabled}">
        <label for="calendar-downloads-enabled">Enable calendar downloads</label>
        <button type="submit">Save settings</button>
    </form>
</main>
</body>
</html>
