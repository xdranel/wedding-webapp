<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Partners</title></head>
<body>
  <main>
    <h1>Partners</h1>
    <p th:if="${param.partnerSaved}">Partner saved.</p>
	<p th:if="${swapError}" th:text="${swapError}" role="alert">Partners changed by another administrator.</p>
    <form method="post" th:action="@{/admin/wedding/partners/swap}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit">Swap partner order</button>
    </form>
    <section th:each="partner : ${partnerForms}">
      <h2 th:text="${partner.fullName ?: 'Partner'}">Partner</h2>
      <form th:if="${form != null and form.id == partner.id}" method="post" enctype="multipart/form-data"
            th:action="@{/admin/wedding/partners/{id}(id=${partner.id})}" th:object="${form}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{version}">
        <p id="partner-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert">Partner error</p>
        <label for="full-name">Full name</label>
        <input id="full-name" th:field="*{fullName}" maxlength="160" required aria-describedby="full-name-error">
        <p id="full-name-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" role="alert">Full name error</p>
        <label for="nickname">Nickname</label>
        <input id="nickname" th:field="*{nickname}" maxlength="80" required aria-describedby="nickname-error">
        <p id="nickname-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" role="alert">Nickname error</p>
        <label for="photo">Photo</label>
        <input id="photo" type="file" th:field="*{photo}" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-error">
        <p id="photo-error" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}" role="alert">Photo error</p>
        <label for="child-of-label-id">Child-of label (Indonesian)</label>
        <input id="child-of-label-id" th:field="*{childOfLabelId}" maxlength="120" required aria-describedby="child-of-label-id-error">
        <p id="child-of-label-id-error" th:if="${#fields.hasErrors('childOfLabelId')}" th:errors="*{childOfLabelId}" role="alert">Child-of label error</p>
        <label for="child-of-label-en">Child-of label (English)</label>
        <input id="child-of-label-en" th:field="*{childOfLabelEn}" maxlength="120" aria-describedby="child-of-label-en-error">
        <p id="child-of-label-en-error" th:if="${#fields.hasErrors('childOfLabelEn')}" th:errors="*{childOfLabelEn}" role="alert">Child-of label error</p>
        <label for="parents-names-id">Parents (Indonesian)</label>
        <input id="parents-names-id" th:field="*{parentsNamesId}" maxlength="300" required aria-describedby="parents-names-id-error">
        <p id="parents-names-id-error" th:if="${#fields.hasErrors('parentsNamesId')}" th:errors="*{parentsNamesId}" role="alert">Parents error</p>
        <label for="parents-names-en">Parents (English)</label>
        <input id="parents-names-en" th:field="*{parentsNamesEn}" maxlength="300" aria-describedby="parents-names-en-error">
        <p id="parents-names-en-error" th:if="${#fields.hasErrors('parentsNamesEn')}" th:errors="*{parentsNamesEn}" role="alert">Parents error</p>
        <label for="instagram-url">Instagram URL</label>
        <input id="instagram-url" th:field="*{instagramUrl}" maxlength="500" inputmode="url" aria-describedby="instagram-url-error">
        <p id="instagram-url-error" th:if="${#fields.hasErrors('instagramUrl')}" th:errors="*{instagramUrl}" role="alert">Instagram error</p>
        <button type="submit">Save partner</button>
      </form>
      <form th:unless="${form != null and form.id == partner.id}" method="post" enctype="multipart/form-data" th:action="@{/admin/wedding/partners/{id}(id=${partner.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="version" th:value="${partner.version}">
        <label>Full name <input name="fullName" th:value="${partner.fullName}" maxlength="160" required></label>
        <label>Nickname <input name="nickname" th:value="${partner.nickname}" maxlength="80" required></label>
        <label>Photo <input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label>
        <label>Child-of label (Indonesian) <input name="childOfLabelId" th:value="${partner.childOfLabelId}" maxlength="120" required></label>
        <label>Child-of label (English) <input name="childOfLabelEn" th:value="${partner.childOfLabelEn}" maxlength="120"></label>
        <label>Parents (Indonesian) <input name="parentsNamesId" th:value="${partner.parentsNamesId}" maxlength="300" required></label>
        <label>Parents (English) <input name="parentsNamesEn" th:value="${partner.parentsNamesEn}" maxlength="300"></label>
        <label>Instagram URL <input name="instagramUrl" th:value="${partner.instagramUrl}" maxlength="500" inputmode="url"></label>
        <button type="submit">Save partner</button>
      </form>
    </section>
  </main>
</body>
</html>
