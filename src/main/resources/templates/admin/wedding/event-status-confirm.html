<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status.closed} ? 'Reopen event' : 'Close event'">Change event status</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell">
    <nav th:replace="~{fragments/admin-navigation :: sidebar('wedding-settings')}"></nav>
    <div>
        <header class="app-header">
            <h1 th:text="${status.closed} ? 'Reopen event' : 'Close event'">Change event status</h1>
        </header>
        <main id="main-content" class="page-content">
	<section class="card notice">
    <p th:unless="${status.closed}">Block new invitations, RSVP responses, QR access, calendar downloads, check-ins, and message delivery.</p>
    <p th:if="${status.closed}">Restore normal guest-facing operations when the wedding is published.</p>
    <form class="form-grid" method="post" th:action="${status.closed} ? @{/admin/wedding/event-status/reopen} : @{/admin/wedding/event-status/close}" th:object="${form}">
		<p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert">Status error</p>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{version}">
        <input id="confirmed" type="checkbox" th:field="*{confirmed}"
               th:attr="aria-describedby=${#fields.hasErrors('confirmed')} ? 'confirmed-error' : null">
		<label for="confirmed" th:text="${status.closed} ? 'I confirm that guest-facing operations may be restored.' : 'I confirm that guest-facing operations must be blocked.'">Confirmation</label>
        <p id="confirmed-error" th:if="${#fields.hasErrors('confirmed')}" th:errors="*{confirmed}">Confirmation is required</p>
		<button class="button" type="submit" th:text="${status.closed} ? 'Reopen event' : 'Close event'">Change status</button>
    </form>
    <p><a th:href="@{/admin/wedding/event-status}">Back to event status</a></p>
    </section>
        </main>
    </div>
</div>
</body>
</html>
