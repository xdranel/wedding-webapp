<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding events</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell">
    <nav th:replace="~{fragments/admin-navigation :: sidebar('wedding-events')}"></nav>
    <div>
        <header class="app-header">
            <h1>Wedding events</h1>
        </header>
        <main id="main-content" class="page-content">
    <section class="card" aria-labelledby="ceremony-heading">
        <h2 id="ceremony-heading">Ceremony</h2>
        <form class="form-grid" method="post" th:action="@{/admin/wedding/events/CEREMONY}" th:object="${ceremonyForm}">
            <p class="notice" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert">Event error</p>
            <input type="hidden" th:field="*{version}">
            <label><input type="checkbox" th:field="*{visible}"> Show ceremony</label>
            <label for="ceremony-date">Date</label>
            <input id="ceremony-date" type="date" th:field="*{eventDate}"
                   th:attr="aria-describedby=${#fields.hasErrors('eventDate')} ? 'ceremony-date-error' : null">
            <p id="ceremony-date-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" role="alert">Date error</p>
            <label for="ceremony-start">Start time</label>
            <input id="ceremony-start" type="time" th:field="*{startTime}"
                   th:attr="aria-describedby=${#fields.hasErrors('startTime')} ? 'ceremony-start-error' : null">
            <p id="ceremony-start-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" role="alert">Start time error</p>
            <label for="ceremony-end">End time</label>
            <input id="ceremony-end" type="time" th:field="*{endTime}"
                   th:attr="aria-describedby=${#fields.hasErrors('endTime')} ? 'ceremony-end-error' : null">
            <p id="ceremony-end-error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" role="alert">End time error</p>
            <label for="ceremony-venue">Venue name</label>
            <input id="ceremony-venue" th:field="*{venueName}" maxlength="200"
                   th:attr="aria-describedby=${#fields.hasErrors('venueName')} ? 'ceremony-venue-error' : null">
            <p id="ceremony-venue-error" th:if="${#fields.hasErrors('venueName')}" th:errors="*{venueName}" role="alert">Venue error</p>
            <label for="ceremony-address-id">Address (Indonesian)</label>
            <textarea id="ceremony-address-id" th:field="*{addressId}" maxlength="1000"
                      th:attr="aria-describedby=${#fields.hasErrors('addressId')} ? 'ceremony-address-id-error' : null"></textarea>
            <p id="ceremony-address-id-error" th:if="${#fields.hasErrors('addressId')}" th:errors="*{addressId}" role="alert">Address error</p>
            <label for="ceremony-address-en">Address (English, falls back to Indonesian)</label>
            <textarea id="ceremony-address-en" th:field="*{addressEn}" maxlength="1000"></textarea>
            <label for="ceremony-map">Map URL</label>
            <input id="ceremony-map" th:field="*{mapUrl}" maxlength="1000" inputmode="url"
                   th:attr="aria-describedby=${#fields.hasErrors('mapUrl')} ? 'ceremony-map-error' : null">
            <p id="ceremony-map-error" th:if="${#fields.hasErrors('mapUrl')}" th:errors="*{mapUrl}" role="alert">Map URL error</p>
            <button class="button" type="submit">Save ceremony</button>
        </form>
    </section>
    <section class="card" aria-labelledby="reception-heading">
        <h2 id="reception-heading">Reception</h2>
        <form class="form-grid" method="post" th:action="@{/admin/wedding/events/RECEPTION}" th:object="${receptionForm}">
            <p class="notice" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert">Event error</p>
            <input type="hidden" th:field="*{version}">
            <label><input type="checkbox" th:field="*{visible}"> Show reception</label>
            <label for="reception-date">Date</label>
            <input id="reception-date" type="date" th:field="*{eventDate}"
                   th:attr="aria-describedby=${#fields.hasErrors('eventDate')} ? 'reception-date-error' : null">
            <p id="reception-date-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" role="alert">Date error</p>
            <label for="reception-start">Start time</label>
            <input id="reception-start" type="time" th:field="*{startTime}"
                   th:attr="aria-describedby=${#fields.hasErrors('startTime')} ? 'reception-start-error' : null">
            <p id="reception-start-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" role="alert">Start time error</p>
            <label for="reception-end">End time</label>
            <input id="reception-end" type="time" th:field="*{endTime}"
                   th:attr="aria-describedby=${#fields.hasErrors('endTime')} ? 'reception-end-error' : null">
            <p id="reception-end-error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" role="alert">End time error</p>
            <label for="reception-venue">Venue name</label>
            <input id="reception-venue" th:field="*{venueName}" maxlength="200"
                   th:attr="aria-describedby=${#fields.hasErrors('venueName')} ? 'reception-venue-error' : null">
            <p id="reception-venue-error" th:if="${#fields.hasErrors('venueName')}" th:errors="*{venueName}" role="alert">Venue error</p>
            <label for="reception-address-id">Address (Indonesian)</label>
            <textarea id="reception-address-id" th:field="*{addressId}" maxlength="1000"
                      th:attr="aria-describedby=${#fields.hasErrors('addressId')} ? 'reception-address-id-error' : null"></textarea>
            <p id="reception-address-id-error" th:if="${#fields.hasErrors('addressId')}" th:errors="*{addressId}" role="alert">Address error</p>
            <label for="reception-address-en">Address (English, falls back to Indonesian)</label>
            <textarea id="reception-address-en" th:field="*{addressEn}" maxlength="1000"></textarea>
            <label for="reception-map">Map URL</label>
            <input id="reception-map" th:field="*{mapUrl}" maxlength="1000" inputmode="url"
                   th:attr="aria-describedby=${#fields.hasErrors('mapUrl')} ? 'reception-map-error' : null">
            <p id="reception-map-error" th:if="${#fields.hasErrors('mapUrl')}" th:errors="*{mapUrl}" role="alert">Map URL error</p>
            <button class="button" type="submit">Save reception</button>
        </form>
    </section>
        </main>
    </div>
</div>
</body>
</html>
