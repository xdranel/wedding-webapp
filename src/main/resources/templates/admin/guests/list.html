<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guests</title></head>
<body>
<main>
  <h1>Guests</h1>
  <p><a th:href="@{/admin}">Back to administrator home</a> · <a th:href="@{/admin/guests/new}">Add guest</a> · <a th:href="@{/admin/guests/import}">Import CSV</a> · <a th:href="@{/admin/guests/export.csv}">Export CSV</a></p>
  <p th:if="${param.imported}" th:text="|Imported ${param.imported[0]} guests.|">Guests imported.</p>
  <p th:if="${guestError}" th:text="${guestError}" role="alert">Guest error</p>
  <form method="get" th:action="@{/admin/guests}">
    <label>Search <input type="search" name="query" th:value="${filters.query}"></label>
    <label>Delivery <select name="delivery"><option value="">Any</option><option th:each="state : ${T(myweddinginvitation.webapp.guest.DeliveryState).values()}" th:value="${state}" th:text="${state}" th:selected="${state == filters.delivery}">UNSENT</option></select></label>
    <label>Archive <select name="archived"><option value="">Any</option><option value="false" th:selected="${filters.archived == false}">Active</option><option value="true" th:selected="${filters.archived == true}">Archived</option></select></label>
    <label>Category <select name="categoryId"><option value="">Any</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.displayName}" th:selected="${category.id == filters.categoryId}">Category</option></select></label>
    <label>RSVP <select name="rsvpStatus"><option value="">Any</option><option value="NONE" th:selected="${filters.noRsvp}">No RSVP</option><option value="HADIR" th:selected="${filters.rsvp == T(myweddinginvitation.webapp.rsvp.AttendanceResponse).HADIR}">Hadir</option><option value="TIDAK_HADIR" th:selected="${filters.rsvp == T(myweddinginvitation.webapp.rsvp.AttendanceResponse).TIDAK_HADIR}">Tidak hadir</option></select></label>
    <label>Check-in <select name="checkedIn"><option value="">Any</option><option value="true" th:selected="${filters.checkedIn == true}">Checked in</option><option value="false" th:selected="${filters.checkedIn == false}">Not checked in</option></select></label>
    <label>Sort <select name="sort"><option value="updatedAt,desc" th:selected="${sort == 'updatedAt,desc'}">Recently updated</option><option value="updatedAt,asc" th:selected="${sort == 'updatedAt,asc'}">Oldest updated</option><option value="name,asc" th:selected="${sort == 'name,asc'}">Name A–Z</option><option value="name,desc" th:selected="${sort == 'name,desc'}">Name Z–A</option></select></label>
    <button type="submit">Filter</button>
  </form>
  <p th:if="${page.empty}">No guests found.</p>
  <table th:unless="${page.empty}"><thead><tr><th>Name</th><th>WhatsApp</th><th>Category</th><th>Delivery</th><th>RSVP</th><th>Planned attendees</th><th>Actual attendees</th><th>Checked in at</th><th>Archived</th><th>Action</th></tr></thead>
    <tbody><tr th:each="guest : ${page.content}" th:with="rsvp=${rsvps[guest.id]},checkIn=${checkIns[guest.id]}"><td><a th:href="@{/admin/guests/{id}(id=${guest.id})}" th:text="${guest.displayName}">Guest</a></td><td th:text="${guest.normalizedWhatsappNumber}">+62</td><td th:text="${guest.category == null ? 'Uncategorized' : guest.category.displayName}">Uncategorized</td><td th:text="${guest.deliveryState}">UNSENT</td><td th:text="${rsvp == null ? 'No RSVP' : rsvp.response}">No RSVP</td><td th:text="${rsvp == null ? '—' : rsvp.plannedAttendeeCount}">—</td><td th:text="${checkIn == null ? '—' : checkIn.actualAttendeeCount}">—</td><td th:text="${checkIn == null ? '—' : checkIn.checkedInAt}">—</td><td th:text="${guest.archived ? 'Yes' : 'No'}">No</td><td><a th:if="${!guest.archived}" th:href="@{/admin/guests/{id}/rsvp(id=${guest.id})}">Edit RSVP</a></td></tr></tbody>
  </table>
  <p th:if="${page.hasPrevious()}"><a th:href="@{/admin/guests(page=${page.number - 1},query=${filters.query},delivery=${filters.delivery},archived=${filters.archived},categoryId=${filters.categoryId},rsvpStatus=${filters.rsvpStatus},checkedIn=${filters.checkedIn},sort=${sort})}">Previous</a></p>
  <p th:if="${page.hasNext()}"><a th:href="@{/admin/guests(page=${page.number + 1},query=${filters.query},delivery=${filters.delivery},archived=${filters.archived},categoryId=${filters.categoryId},rsvpStatus=${filters.rsvpStatus},checkedIn=${filters.checkedIn},sort=${sort})}">Next</a></p>
</main>
</body>
</html>
