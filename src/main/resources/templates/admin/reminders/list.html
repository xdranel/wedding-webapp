<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reminders</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell">
  <nav th:replace="~{fragments/admin-navigation :: sidebar('reminders')}"></nav>
  <div>
    <header class="app-header"><h1>Reminders</h1></header>
    <main id="main-content" class="page-content">
  <p><a th:href="@{/admin}">Back to administrator home</a></p>
  <nav class="action-cluster" aria-label="Reminder queues" role="tablist">
    <a th:href="@{/admin/reminders(kind=RSVP,categoryId=${categoryId})}" role="tab" th:aria-selected="${kind.name() == 'RSVP'}">RSVP reminders</a>
    <a th:href="@{/admin/reminders(kind=EVENT,categoryId=${categoryId})}" role="tab" th:aria-selected="${kind.name() == 'EVENT'}">Event reminders</a>
  </nav>
  <form class="card filter-panel form-grid" method="get" th:action="@{/admin/reminders}">
    <label>Reminder queue
      <select name="kind"><option value="RSVP" th:selected="${kind.name() == 'RSVP'}">RSVP</option><option value="EVENT" th:selected="${kind.name() == 'EVENT'}">Event</option></select>
    </label>
    <label>Category
      <select name="categoryId"><option value="">All categories</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.displayName}" th:selected="${category.id == categoryId}">Category</option></select>
    </label>
    <button class="button" type="submit">Filter</button>
  </form>
  <p class="notice" th:if="${reminderError}" th:text="${reminderError}" role="alert">Reminder error</p>
  <p class="notice" th:if="${reminderCompletion}" th:text="${reminderCompletion}" role="status">Reminder queue complete.</p>
  <p class="card" th:if="${queue.empty}">No eligible guests remain.</p>
  <p th:if="${!queue.empty}"><a th:href="${'#guest-' + queue.get(0).id}">Next guest</a></p>
  <table class="data-table mobile-card-list" th:unless="${queue.empty}">
    <thead><tr><th>Name</th><th>Category</th><th>WhatsApp</th><th>Preferred language</th><th>RSVP</th><th>Last sent</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="guest : ${queue}" th:id="${'guest-' + guest.id}">
        <td data-label="Name" th:text="${guest.displayName}">Guest</td>
        <td data-label="Category" th:text="${guest.categoryName == null ? 'Uncategorized' : guest.categoryName}">Uncategorized</td>
        <td data-label="WhatsApp" th:text="${guest.whatsappNumber}">+62</td>
        <td data-label="Preferred language"><span class="badge" th:text="${guest.preferredLanguage}">ID</span></td>
        <td data-label="RSVP"><span class="badge" th:text="${guest.rsvpResponse == null ? 'No RSVP' : guest.rsvpResponse}">No RSVP</span></td>
        <td data-label="Last sent" th:text="${guest.lastSentAt == null ? 'Never' : guest.lastSentAt}">Never</td>
        <td data-label="Actions"><div class="action-cluster">
          <form class="form-grid" method="post" th:action="@{/admin/reminders/{kind}/{guestId}/open-whatsapp(kind=${kind},guestId=${guest.id})}">
            <input type="hidden" name="categoryId" th:value="${categoryId}">
            <label>Message language
              <select name="language"><option value="ID" th:selected="${guest.preferredLanguage.name() == 'ID'}">Indonesian</option><option value="EN" th:selected="${guest.preferredLanguage.name() == 'EN'}">English</option></select>
            </label>
            <button class="button" type="submit">Open WhatsApp</button>
          </form>
          <form method="post" th:action="@{/admin/reminders/{kind}/{guestId}/confirm-sent(kind=${kind},guestId=${guest.id})}">
            <input type="hidden" name="version" th:value="${guest.version}">
            <input type="hidden" name="categoryId" th:value="${categoryId}">
            <button class="button" type="submit">Confirm sent</button>
          </form>
        </div></td>
      </tr>
    </tbody>
  </table>
    </main>
  </div>
</div>
</body>
</html>
