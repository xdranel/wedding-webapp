<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greeting moderation</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell">
  <nav th:replace="~{fragments/admin-navigation :: sidebar('attendance')}"></nav>
  <div>
    <header class="app-header"><h1>Greeting moderation</h1></header>
    <main id="main-content" class="page-content">
  <p><a th:href="@{/admin}">Back to administrator home</a></p>
  <p class="notice" th:if="${greetingError}" th:text="${greetingError}" role="alert">Greeting error</p>
  <nav class="action-cluster" aria-label="Greeting state">
    <a th:href="@{/admin/greetings(state='PENDING')}">Pending</a>
    <a th:href="@{/admin/greetings(state='APPROVED')}">Approved</a>
    <a th:href="@{/admin/greetings(state='HIDDEN')}">Hidden</a>
  </nav>
  <p class="card" th:if="${page.empty}">No greetings found.</p>
  <table class="data-table mobile-card-list" th:unless="${page.empty}">
    <thead><tr><th>Guest</th><th>Greeting</th><th>State</th><th>Action</th></tr></thead>
    <tbody>
      <tr th:each="greeting : ${page.content}">
        <td data-label="Guest" th:text="${greeting.displayName}">Guest</td>
        <td data-label="Greeting" th:text="${greeting.greeting}">Greeting</td>
        <td data-label="State"><span class="badge" th:text="${greeting.moderationState}">PENDING</span></td>
        <td data-label="Action"><div class="action-cluster">
          <form th:if="${greeting.moderationState != T(myweddinginvitation.webapp.rsvp.GreetingModerationState).APPROVED}"
                method="post" th:action="@{/admin/greetings/{id}/approve(id=${greeting.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="version" th:value="${greeting.version}">
            <button class="button" type="submit">Approve</button>
          </form>
          <form th:if="${greeting.moderationState != T(myweddinginvitation.webapp.rsvp.GreetingModerationState).HIDDEN}"
                method="post" th:action="@{/admin/greetings/{id}/hide(id=${greeting.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="version" th:value="${greeting.version}">
            <button class="button" type="submit">Hide</button>
          </form>
        </div></td>
      </tr>
    </tbody>
  </table>
  <p th:if="${page.hasPrevious()}"><a th:href="@{/admin/greetings(state=${state},page=${page.number - 1})}">Previous</a></p>
  <p th:if="${page.hasNext()}"><a th:href="@{/admin/greetings(state=${state},page=${page.number + 1})}">Next</a></p>
    </main>
  </div>
</div>
</body>
</html>
