<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${heading}">Staff account</title>
</head>
<body>
  <main>
    <h1 th:text="${heading}">Staff account</h1>
    <p><a th:href="@{/admin/accounts}">Back to staff accounts</a></p>
    <form method="post" th:action="${action}" th:object="${form}">
      <div th:if="${action == '/admin/accounts'}">
        <label for="username">Username</label>
        <input id="username" th:field="*{username}" maxlength="100" required>
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" role="alert">Username error</p>
      </div>
      <label for="temporary-password">Temporary password</label>
      <input id="temporary-password" type="password" th:field="*{temporaryPassword}" minlength="12" maxlength="200" required>
      <p th:if="${#fields.hasErrors('temporaryPassword')}" th:errors="*{temporaryPassword}" role="alert">Password error</p>
      <button type="submit" th:text="${action == '/admin/accounts'} ? 'Create staff account' : 'Reset password'">Submit</button>
    </form>
  </main>
</body>
</html>
