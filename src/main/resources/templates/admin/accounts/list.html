<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff accounts</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell">
  <nav th:replace="~{fragments/admin-navigation :: sidebar('staff-accounts')}"></nav>
  <div>
    <header class="app-header"><h1>Staff accounts</h1><a class="button" th:href="@{/admin/accounts/new}">Create staff account</a></header>
    <main id="main-content" class="page-content">
    <p><a th:href="@{/admin}">Back to administrator home</a></p>
    <p class="card" th:if="${accounts.empty}">No staff accounts yet.</p>
    <table class="data-table mobile-card-list" th:unless="${accounts.empty}">
      <thead><tr><th>Username</th><th>Account status</th><th>Password status</th><th>Actions</th></tr></thead>
      <tbody><tr th:each="account : ${accounts}">
        <td data-label="Username"><strong th:text="${account.username}">staff</strong></td>
        <td data-label="Account status"><span class="badge" th:text="${account.enabled} ? 'Enabled' : 'Disabled'">Enabled</span></td>
        <td data-label="Password status"><span class="badge" th:text="${account.passwordChangeRequired} ? 'Password change required' : 'Password changed'">Password change required</span></td>
        <td data-label="Actions"><details class="action-overflow">
        <summary>More actions</summary>
        <div>
        <a th:href="@{/admin/accounts/{id}/reset(id=${account.id})}">Reset password</a>
        <form th:if="${account.enabled}" method="post" th:action="@{/admin/accounts/{id}/disable(id=${account.id})}">
          <button class="button" type="submit">Disable</button>
        </form>
        <form th:unless="${account.enabled}" method="post" th:action="@{/admin/accounts/{id}/enable(id=${account.id})}">
          <button class="button" type="submit">Enable</button>
        </form>
        </div>
        </details></td>
      </tr></tbody>
    </table>
    </main>
  </div>
</div>
</body>
</html>
