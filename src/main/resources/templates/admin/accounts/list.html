<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff accounts</title>
</head>
<body>
  <main>
    <h1>Staff accounts</h1>
    <p><a th:href="@{/admin}">Back to administrator home</a></p>
    <p><a th:href="@{/admin/accounts/new}">Create staff account</a></p>
    <p th:if="${accounts.empty}">No staff accounts yet.</p>
    <ul>
      <li th:each="account : ${accounts}">
        <strong th:text="${account.username}">staff</strong>
        <span th:text="${account.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
        <span th:text="${account.passwordChangeRequired} ? 'Password change required' : 'Password changed'">Password change required</span>
        <a th:href="@{/admin/accounts/{id}/reset(id=${account.id})}">Reset password</a>
        <form th:if="${account.enabled}" method="post" th:action="@{/admin/accounts/{id}/disable(id=${account.id})}">
          <button type="submit">Disable</button>
        </form>
        <form th:unless="${account.enabled}" method="post" th:action="@{/admin/accounts/{id}/enable(id=${account.id})}">
          <button type="submit">Enable</button>
        </form>
      </li>
    </ul>
  </main>
</body>
</html>
