<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password</title>
  <style> :focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; } </style>
</head>
<body>
  <main>
    <h1>Change password</h1>
    <p>Replace the temporary password before continuing.</p>
    <form method="post" th:action="@{/account/password}" th:object="${passwordChangeForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <p>
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" th:field="*{currentPassword}" type="password"
               autocomplete="current-password" maxlength="200" required autofocus>
        <span th:errors="*{currentPassword}" role="alert"></span>
      </p>
      <p>
        <label for="newPassword">New password</label>
        <input id="newPassword" th:field="*{newPassword}" type="password"
               autocomplete="new-password" minlength="12" maxlength="200" required>
        <span th:errors="*{newPassword}" role="alert"></span>
      </p>
      <p>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
               autocomplete="new-password" maxlength="200" required>
        <span th:errors="*{confirmPassword}" role="alert"></span>
      </p>
      <button type="submit">Change password</button>
    </form>
    <form method="post" th:action="@{/logout}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit">Sign out</button>
    </form>
  </main>
</body>
</html>
