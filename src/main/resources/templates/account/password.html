<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-shell">
<main class="auth-card card">
    <h1>Change password</h1>
    <p class="notice">Replace the temporary password before continuing.</p>
    <form class="form-grid" method="post" th:action="@{/account/password}" th:object="${passwordChangeForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p>
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" th:field="*{currentPassword}" type="password"
                   autocomplete="current-password" maxlength="200" required autofocus>
            <span class="status status-error" th:errors="*{currentPassword}" role="alert"></span>
        </p>
        <p>
            <label for="newPassword">New password</label>
            <input id="newPassword" th:field="*{newPassword}" type="password"
                   autocomplete="new-password" minlength="12" maxlength="200" required>
            <span class="status status-error" th:errors="*{newPassword}" role="alert"></span>
        </p>
        <p>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
                   autocomplete="new-password" maxlength="200" required>
            <span class="status status-error" th:errors="*{confirmPassword}" role="alert"></span>
        </p>
        <button class="button" type="submit">Change password</button>
    </form>
    <form class="form-grid" method="post" th:action="@{/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="button" type="submit">Sign out</button>
    </form>
</main>
</body>
</html>
