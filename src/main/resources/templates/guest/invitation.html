<!doctype html>
<html th:lang="${language == 'EN'} ? 'en' : 'id'" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${#strings.isEmpty(preview.coupleTitle) ? 'Wedding invitation' : preview.coupleTitle}">
        Wedding invitation
    </title>
    <link rel="stylesheet" th:href="@{/css/invitation.css}">
</head>
<body th:attr="data-font=${preview.fontPreset}" th:style="|--accent: ${accentColor};|">
<main>
    <section id="cover" class="cover" aria-labelledby="invitation-title">
        <p th:text="${language == 'EN'} ? 'Wedding invitation' : 'Undangan pernikahan'">Undangan pernikahan</p>
        <h1 id="invitation-title"
            th:text="${#strings.isEmpty(preview.coupleTitle) ? 'Wedding invitation' : preview.coupleTitle}">
            Wedding invitation
        </h1>
        <p th:if="${preview.coverDate != null}">
            <time th:datetime="${preview.coverDate}" th:text="${preview.coverDate}">2027-05-01</time>
        </p>
        <p th:text="${preview.salutation + ' ' + preview.guestName}">Bapak/Ibu Nama Tamu</p>
    </section>

    <section th:if="${!#strings.isEmpty(preview.openingText)}" aria-labelledby="opening-title">
        <h2 id="opening-title" th:text="${language == 'EN'} ? 'Welcome' : 'Sapaan'">Sapaan</h2>
        <p th:text="${preview.openingText}">Selamat datang</p>
    </section>

    <section aria-labelledby="partners-title">
        <h2 id="partners-title" th:text="${language == 'EN'} ? 'The couple' : 'Mempelai'">Mempelai</h2>
        <article th:each="partner : ${preview.partners}">
            <h3 th:text="${partner.fullName ?: partner.nickname ?: 'Partner'}">Partner</h3>
            <p th:if="${!#strings.isEmpty(partner.childOfLabel)}" th:text="${partner.childOfLabel}">Putra/Putri</p>
            <p th:if="${!#strings.isEmpty(partner.parentsNames)}" th:text="${partner.parentsNames}">Keluarga</p>
            <a th:if="${!#strings.isEmpty(partner.instagramUrl)}" th:href="${partner.instagramUrl}"
               rel="noopener noreferrer">Instagram</a>
        </article>
    </section>

    <section th:each="event : ${preview.events}" th:aria-labelledby="${'event-' + event.type}">
        <h2 th:id="${'event-' + event.type}"
            th:text="${event.type.name() == 'CEREMONY'} ? (${language == 'EN'} ? 'Ceremony' : 'Akad') : (${language == 'EN'} ? 'Reception' : 'Resepsi')">
            Akad
        </h2>
        <p th:if="${event.date != null}">
            <time th:datetime="${event.date}" th:text="${event.date}">2027-05-01</time>
        </p>
        <p th:if="${event.startTime != null}"
           th:text="${event.endTime != null} ? ${event.startTime + '–' + event.endTime} : ${event.startTime}">
            08:00
        </p>
        <h3 th:if="${!#strings.isEmpty(event.venueName)}" th:text="${event.venueName}">Venue</h3>
        <p th:if="${!#strings.isEmpty(event.address)}" th:text="${event.address}">Address</p>
        <a th:if="${!#strings.isEmpty(event.mapUrl)}" th:href="${event.mapUrl}" rel="noopener noreferrer"
           target="_blank" th:text="${language == 'EN'} ? 'Open map' : 'Buka peta'">Buka peta</a>
    </section>

    <section th:if="${!preview.story.empty}" aria-labelledby="story-title">
        <h2 id="story-title" th:text="${language == 'EN'} ? 'Our story' : 'Kisah kami'">Kisah kami</h2>
        <article th:each="entry : ${preview.story}">
            <p th:if="${entry.date != null}">
                <time th:datetime="${entry.date}" th:text="${entry.date}">2027-05-01</time>
            </p>
            <h3 th:text="${entry.title}">Story title</h3>
            <p th:text="${entry.body}">Story body</p>
        </article>
    </section>

    <section th:if="${!#strings.isEmpty(preview.closingText)}" aria-labelledby="closing-title">
        <h2 id="closing-title" th:text="${language == 'EN'} ? 'Closing' : 'Penutup'">Penutup</h2>
        <p th:text="${preview.closingText}">Terima kasih</p>
    </section>
</main>
</body>
</html>
