name: Production verification

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image, including a vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: verification/package-lock.json

      - name: Validate immutable image input
        env:
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/.+:v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Run serial production verification
        env:
          IMAGE: ${{ inputs.image }}
        run: scripts/production/verify-release.sh --image "$IMAGE"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: production-verification-${{ github.run_id }}
          path: /tmp/wedding-phase7d/reports/
          if-no-files-found: warn
          retention-days: 14
