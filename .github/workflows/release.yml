name: Release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xdranel/wedding-webapp

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java tests
        run: ./mvnw -B test

      - name: JavaScript tests
        run: node --test src/test/js/admin-navigation.test.js src/test/js/invitation-media.test.js

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build image for security scan
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: wedding-release-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wedding-release-scan:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Publish verified image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
